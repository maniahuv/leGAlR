# Cấu hình mặc định cho Legal RAG.
# Bản nâng cấp này hỗ trợ 2 nguồn dữ liệu:
#   1) huggingface: th1nhng0/vietnamese-legal-documents, dùng làm baseline.
#   2) local_pdf: file chính thức tự thu thập từ vbpl.vn / vanban.chinhphu.vn (.pdf/.docx/.doc/.txt).

# Đổi source thành "huggingface" nếu muốn quay về pipeline cũ.
dataset:
  source: "local_pdf"              # local_pdf | huggingface

  # -------- Local official corpus: Hôn nhân & Gia đình (.pdf/.docx/.doc/.txt) --------
  domain: "family_law"
  raw_dir: "data/raw/family_law/pdfs"
  manifest_path: "data/raw/family_law/manifest.jsonl"
  relationships_path: "data/raw/family_law/relationships.jsonl"
  processed_dir: "data/processed/family_law"
  interim_dir: "data/interim/family_law"
  # Ngưỡng tối thiểu số ký tự trích xuất. PDF scan ảnh thường trả về gần 0 ký tự.
  min_pdf_chars: 100

  # -------- HuggingFace baseline --------
  name: "th1nhng0/vietnamese-legal-documents"
  content_config: "content"
  metadata_config: "metadata"
  relationships_config: "relationships"
  split: "data"
  content_filter_chars: 6000
  include_graph_neighbors: true
  graph_expansion_hops: 1
  graph_expansion_max_docs: 800
  max_docs: null       # đặt số nguyên nếu muốn giới hạn số văn bản ingest
  sample_size: null    # chỉ dùng để debug nhanh

chunking:
  # legal_article ưu tiên 1 chunk = 1 Điều; nếu Điều quá dài thì split tiếp nhưng vẫn giữ article metadata.
  strategy: "legal_article"   # legal_article | legal_recursive | recursive
  chunk_size: 1100
  chunk_overlap: 120
  keep_legal_structure: true
  keep_article_boundary: true

retrieval:
  k: 5
  pool_multiplier: 8
  min_pool_size: 40
  accurate_pool_multiplier: 12
  accurate_min_pool_size: 60
  rrf_k: 60
  dense_weight: 0.85
  bm25_weight: 0.35
  graph_weight: 1.15
  fusion_metadata_weight: 0.06
  graph_max_hops: 1
  graph_seed_doc_limit: 8
  graph_expansion_limit: 40
  graph_docid_filter_limit: 40
  use_conditional_rerank: false
  use_cross_encoder: false
  cross_encoder_model: "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"
  cross_encoder_max_chars: 3000
  context_chars_per_doc: 2300
  log_retrieval: false

  # Với corpus HN&GĐ, dense là backbone; auto chỉ override bằng authority_dense khi intent chắc chắn.
  default_strategy: "auto"
  metadata_weight: 0.12
  metadata_k: 60
  metadata_max_candidates: 2000
  authority_weight: 0.55
  authority_k: 20
  max_article_chars: 6500
  hybrid_preserve_dense_top_k: 3
  rerank_rank_prior_weight: 0.20

generation:
  temperature: 0.0
  max_tokens: 384

embedding:
  # Nhẹ, chạy CPU được. Nếu máy khỏe, thử BAAI/bge-m3 hoặc intfloat/multilingual-e5-base.
  model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  device: "cpu"

vector_store:
  collection_name: "family_law_docs"
  persist_directory: "data/chroma/family_law"
  reset_on_ingest: true

bm25:
  persist_path: "data/bm25/family_law_bm25.pkl"

graph:
  persist_path: "data/graph/family_law_relationships.pkl"

llm:
  # Có thể override bằng biến môi trường LLM_MODEL.
  model: "gemini-3.5-flash"
  temperature: 0.1

api:
  default_k: 5
